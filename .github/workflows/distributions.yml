name: Signed service distributions
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package with a checked-in distribution recipe
        type: choice
        options: [node, caddy, mailpit, dnsmasq]
        required: true
      version:
        description: Version matching the recipe filename
        required: true
permissions:
  contents: read
concurrency:
  group: distribution-${{ inputs.package }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MORROW_EXPECTED_TEAM: ${{ vars.MORROW_APPLE_TEAM_ID }}
      MORROW_PACKAGE: ${{ inputs.package }}
      MORROW_PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Import release signing material
        env:
          MORROW_CERTIFICATE_P12_BASE64: ${{ secrets.MORROW_CERTIFICATE_P12_BASE64 }}
          MORROW_CERTIFICATE_PASSWORD: ${{ secrets.MORROW_CERTIFICATE_PASSWORD }}
          MORROW_NOTARY_KEY_BASE64: ${{ secrets.MORROW_NOTARY_KEY_BASE64 }}
          MORROW_NOTARY_KEY_ID: ${{ secrets.MORROW_NOTARY_KEY_ID }}
          MORROW_NOTARY_ISSUER_ID: ${{ secrets.MORROW_NOTARY_ISSUER_ID }}
        run: python3 scripts/release-keychain.py
      - name: Prepare and sign the Apple silicon package
        run: |
          python3 scripts/package-distribution.py --recipe "distributions/$MORROW_PACKAGE/$MORROW_PACKAGE_VERSION.json" --output .build/distribution-release --identity "$MORROW_SIGNING_IDENTITY" --team "$MORROW_EXPECTED_TEAM"
      - name: Notarize the distributions
        run: scripts/notarize-distribution.sh .build/distribution-release
      - name: Upload signed packages and descriptors
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-macos
          path: |
            .build/distribution-release/*-macos-*.tar.gz
            .build/distribution-release/*-release.json
            .build/distribution-release/notarization.json
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: python3 scripts/release-keychain.py --cleanup
