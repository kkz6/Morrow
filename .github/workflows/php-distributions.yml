name: Signed PHP distributions
on:
  workflow_dispatch:
    inputs:
      version:
        description: PHP version with a checked-in distribution recipe
        required: true
        default: '8.0.30'
permissions:
  contents: read
concurrency:
  group: php-distribution-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MORROW_EXPECTED_TEAM: ${{ vars.MORROW_APPLE_TEAM_ID }}
      MORROW_PHP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Import release signing material
        env:
          MORROW_CERTIFICATE_P12_BASE64: ${{ secrets.MORROW_CERTIFICATE_P12_BASE64 }}
          MORROW_CERTIFICATE_PASSWORD: ${{ secrets.MORROW_CERTIFICATE_PASSWORD }}
          MORROW_NOTARY_KEY_BASE64: ${{ secrets.MORROW_NOTARY_KEY_BASE64 }}
          MORROW_NOTARY_KEY_ID: ${{ secrets.MORROW_NOTARY_KEY_ID }}
          MORROW_NOTARY_ISSUER_ID: ${{ secrets.MORROW_NOTARY_ISSUER_ID }}
        run: python3 scripts/release-keychain.py
      - name: Prepare and sign both Mac architectures
        run: |
          python3 scripts/package-php.py --recipe "distributions/php/$MORROW_PHP_VERSION.json" --output .build/php-release --identity "$MORROW_SIGNING_IDENTITY" --team "$MORROW_EXPECTED_TEAM"
      - name: Notarize the PHP packages
        run: scripts/notarize-php.sh .build/php-release
      - name: Upload signed packages and release descriptors
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ inputs.version }}-macos
          path: |
            .build/php-release/php-*-macos-*.tar.gz
            .build/php-release/*-release.json
            .build/php-release/notarization.json
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: python3 scripts/release-keychain.py --cleanup
