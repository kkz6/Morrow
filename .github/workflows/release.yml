name: Signed macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Resources/Info.plist (for example 0.2.4)
        required: true
        default: '0.2.4'
      publish:
        description: Publish the notarized app and signed update feed
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: morrow-signed-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      REQUESTED_VERSION: ${{ inputs.version }}
      MORROW_EXPECTED_TEAM: ${{ vars.MORROW_APPLE_TEAM_ID }}
      MORROW_DEFAULT_BINARY_CATALOG_URL: ${{ vars.MORROW_BINARY_CATALOG_URL }}
      MORROW_APP_OUTPUT: build/release/Morrow.app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release source and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/prepare-app-release.py
      - name: Run tests
        run: ./scripts/test.sh
      - name: Import Developer ID into a temporary keychain
        env:
          MORROW_CERTIFICATE_P12_BASE64: ${{ secrets.MORROW_CERTIFICATE_P12_BASE64 }}
          MORROW_CERTIFICATE_PASSWORD: ${{ secrets.MORROW_CERTIFICATE_PASSWORD }}
          MORROW_NOTARY_KEY_BASE64: ${{ secrets.MORROW_NOTARY_KEY_BASE64 }}
          MORROW_NOTARY_KEY_ID: ${{ secrets.MORROW_NOTARY_KEY_ID }}
          MORROW_NOTARY_ISSUER_ID: ${{ secrets.MORROW_NOTARY_ISSUER_ID }}
        run: python3 scripts/release-keychain.py
      - name: Build and sign the app, CLI, and updater
        run: ./scripts/build-app.sh release
      - name: Notarize, staple, and package
        run: ./scripts/notarize-app.sh
      - name: Sign and verify the update feed
        env:
          MORROW_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.MORROW_SPARKLE_ED_PRIVATE_KEY }}
        run: ./scripts/generate-appcast.sh
      - name: Upload release and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Morrow-${{ env.MORROW_RELEASE_VERSION || inputs.version || github.ref_name }}-macos-arm64
          path: |
            build/release/Morrow-*.zip
            build/release/SHA256SUMS
            build/release/appcast.xml
            build/release/notarization.json
            build/release/notarization-log.json
          if-no-files-found: ignore
      - name: Publish verified release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$MORROW_RELEASE_VERSION"
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/morrow-release.json" 2>/dev/null; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "A published release is immutable; use a new version.")' "$RUNNER_TEMP/morrow-release.json"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Morrow $MORROW_RELEASE_VERSION" --notes-file build/release/release-notes.md
          fi
          gh release upload "$tag" \
            "build/release/Morrow-$MORROW_RELEASE_VERSION-macos-arm64.zip" \
            build/release/SHA256SUMS build/release/appcast.xml --clobber
          gh release edit "$tag" --draft=false --latest
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/release-keychain.py --cleanup
